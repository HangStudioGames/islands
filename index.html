<title>Islas</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap">
<style>
/* Layout: a game table. The archipelago chart on the left, the "what you do now" panel and the seats on the right, the logbook below. */
:root {
  --bg: #e3edef;
  --surface: #ffffff;
  --surface-2: #eff5f6;
  --ink: #12303a;
  --muted: #557079;
  --line: #c6d8dc;
  --sea: #b4dbe2;
  --sea-2: #9ccbd5;
  --land: #ecdcab;
  --land-edge: #b6975a;
  --ash: #4c4541;
  --lava: #d9472b;
  --accent: #1b4552;
  --accent-ink: #ffffff;
  --gold: #c58b2a;
  --gold-bg: #f8ecd2;
  --ok: #23824c;
  --bad: #c03a2b;
  --bad-bg: #fbe3df;
  --focus: #2a72d8;
  --boat: #6b4a2a;
  --p0: #d4423a; --p1: #2e6ccc; --p2: #e2a91c; --p3: #2b9354; --p4: #8a4cc8;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1a1f; --surface: #13252b; --surface-2: #1a3038; --ink: #e2eef0; --muted: #8fb0b8; --line: #27434c;
    --sea: #12363f; --sea-2: #0f2d35; --land: #bba674; --land-edge: #87713f; --ash: #2d2826; --lava: #f0613f;
    --accent: #84c9d3; --accent-ink: #0c1a1f; --gold: #e2b45a; --gold-bg: #33291a;
    --ok: #4cc27d; --bad: #f07563; --bad-bg: #3a1d1a; --focus: #7aaaff; --boat: #d9b98d;
    --p0: #ee5f55; --p1: #5a8ff0; --p2: #f1c140; --p3: #3fb46e; --p4: #a873e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1a1f; --surface: #13252b; --surface-2: #1a3038; --ink: #e2eef0; --muted: #8fb0b8; --line: #27434c;
  --sea: #12363f; --sea-2: #0f2d35; --land: #bba674; --land-edge: #87713f; --ash: #2d2826; --lava: #f0613f;
  --accent: #84c9d3; --accent-ink: #0c1a1f; --gold: #e2b45a; --gold-bg: #33291a;
  --ok: #4cc27d; --bad: #f07563; --bad-bg: #3a1d1a; --focus: #7aaaff; --boat: #d9b98d;
  --p0: #ee5f55; --p1: #5a8ff0; --p2: #f1c140; --p3: #3fb46e; --p4: #a873e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.app { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 48px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* Buttons */
.btn { appearance: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 700; line-height: 1.2; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.sel { background: var(--gold-bg); border-color: var(--gold); }
.btn.ghost { background: transparent; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
input[type=text] { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; min-width: 0; }
select { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; max-width: 100%; }
.err { color: var(--bad); font-weight: 700; }
.note { color: var(--muted); font-size: 13px; }

/* Language selector */
.langsel { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); flex: none; }
.langsel button { appearance: none; border: 0; background: transparent; padding: 4px 11px; font-size: 13px; font-weight: 800; letter-spacing: .06em; cursor: pointer; color: var(--muted); }
.langsel button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.homebar { display: flex; justify-content: flex-end; padding-block: 2px 0; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 10px 26px; }
.hero h1 { font-size: clamp(56px, 11vw, 112px); line-height: .9; color: var(--accent); }
.hero .lede { font-size: 18px; margin-top: 10px; max-width: 34ch; }
.hero .facts { margin-top: 14px; color: var(--muted); }
.hero svg { width: 100%; height: auto; display: block; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.open-list { display: flex; flex-direction: column; gap: 6px; }
.open-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; }
.code { font-family: var(--font-display); letter-spacing: .12em; font-size: 15px; }
.bigcode { font-family: var(--font-display); font-size: 54px; letter-spacing: .14em; color: var(--accent); line-height: 1; }

/* Game */
.top { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding-block: 2px 12px; }
.logo { font-family: var(--font-display); font-size: 30px; color: var(--accent); line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
.chip.hot { background: var(--bad-bg); border-color: var(--lava); color: var(--bad); font-weight: 700; }
.board { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
.mapwrap { background: var(--sea); border-radius: 18px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.mapwrap svg { display: block; width: 100%; height: auto; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.turn { border: 2px solid var(--gold); box-shadow: 0 0 0 4px var(--gold-bg); }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
.chars { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.char { text-align: left; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.char:hover:not(:disabled) { border-color: var(--accent); }
.char:disabled { opacity: .45; cursor: not-allowed; }
.char b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.char small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.char small b { font-family: var(--font-body); font-weight: 800; font-size: 12px; }
.char .st { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--bad); }
.sub { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.mvrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 8px; background: var(--surface-2); border-radius: 10px; }
.peek { display: flex; gap: 8px; flex-wrap: wrap; }
.ecard { width: 84px; height: 112px; border-radius: 10px; border: 2px solid var(--lava); background: var(--bad-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 6px; text-align: center; font-weight: 800; font-size: 13px; }
.ecard:hover { outline: 3px solid var(--gold); }
.ecard .sz { font-size: 11px; font-weight: 700; color: var(--muted); }

/* Seats */
.seats { display: flex; flex-direction: column; gap: 8px; }
.seat { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.seat.now { border-color: var(--gold); box-shadow: inset 4px 0 0 var(--gold); }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
.seat .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .pv { font-family: var(--font-display); font-size: 20px; text-align: right; }
.seat .det { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.res { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--ink); }
.res svg { width: 16px; height: 16px; }
.mini { display: inline-flex; gap: 3px; }
.mini span { font-size: 11px; font-weight: 800; border-radius: 5px; padding: 0 4px; border: 1px solid var(--line); color: var(--ink); }
.mini span.x { opacity: .35; text-decoration: line-through; }
.mini span.p { background: var(--gold-bg); border-color: var(--gold); }
.tag { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); margin-left: 6px; }
.log { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; max-height: 240px; overflow: auto; font-size: 13px; }
.log ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.banner { background: var(--bad-bg); border: 1.5px solid var(--lava); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
details.rules { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; margin-top: 16px; }
details.rules summary { cursor: pointer; font-weight: 800; }
details.rules .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 24px; margin-top: 10px; font-size: 14px; }
details.rules ul { margin: 6px 0 0; padding-left: 18px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
tr.win td { font-weight: 800; background: var(--gold-bg); }

/* Map */
.isl { cursor: default; }
.isl.tgt { cursor: pointer; }
.isl.tgt .shore { stroke: var(--gold); stroke-width: 5; stroke-dasharray: 8 5; }
.isl.erupt .shore { stroke: var(--lava); stroke-width: 6; }
.isl text { font-family: var(--font-body); }
.isl .nm { font-weight: 800; font-size: 15px; fill: var(--ink); }
.isl .kind { font-size: 11px; fill: var(--muted); font-weight: 700; }
.tok-n { font-weight: 800; font-size: 12px; fill: #fff; stroke: rgba(0,0,0,.5); stroke-width: 2.5px; paint-order: stroke; }
.boat-line { stroke: var(--boat); stroke-width: 3; stroke-dasharray: 2 6; stroke-linecap: round; }
.boat-line.rm { stroke: var(--lava); stroke-width: 4; }
.boat-line.add { stroke: var(--ok); stroke-width: 4; stroke-dasharray: 8 5; }

@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .isl.erupt .shore { animation: glow 1.2s ease-in-out infinite alternate; }
  @keyframes glow { from { stroke-opacity: .4; } to { stroke-opacity: 1; } }
}
</style>

<script>
/*ENGINE-START*/
// El motor no contiene textos: la bitácora guarda sucesos como [clave, ...datos] y cada pantalla los
// traduce a su idioma (fmtLog), así cada jugador puede jugar en el idioma que prefiera.
const ISL = [
  { sz: 2, r: [0, 1, 2] }, // Isla Mayor
  { sz: 1, r: [0, 1] },    // Ensenada
  { sz: 1, r: [1, 2] },    // Arrecife
  { sz: 1, r: [2, 0] },    // Palmar
  { sz: 0, r: [0] },       // Jabalí
  { sz: 0, r: [1] },       // Nácar
  { sz: 0, r: [2] },       // Cocotal
];
const TH = [1, 2, 3];          // erupción: pequeña, mediana, grande
const SAC = [2, 1, 0];         // PV por sacrificar
const PEN = [3, 2, 1];         // penalización por meeple perdido
const MAJ = [[2, 1], [3, 1], [4, 2]];
// Orden de las islas alrededor de la Isla Mayor: se sortea en cada partida (G.ring).
// RING es solo el orden de la portada y de partidas guardadas antes de este cambio.
const RING = [1, 5, 2, 6, 3, 4];
const ringOf = G => (G && Array.isArray(G.ring) && G.ring.length === 6) ? G.ring : RING;
const DECK0 = [0, 0, 0, 1, 1, 2, 2, 3, 3, 4, 5, 6];
const SCHED = [6, 11, 15, 18, 20, 21];
const MEEPLES = 12;
// Parejas de islas que un barco puede unir: la Isla Mayor con cada periférica, y cada periférica con sus vecinas del anillo.
function pairsOf(G) {
  const ring = ringOf(G), s = [];
  for (let k = 1; k <= 6; k++) s.push([0, k]);
  for (let i = 0; i < 6; i++) { const a = ring[i], b = ring[(i + 1) % 6]; s.push(a < b ? [a, b] : [b, a]); }
  return s;
}

function rid(n) { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sameEdge = (e, a, b) => (e[0] === a && e[1] === b) || (e[0] === b && e[1] === a);
const hasEdge = (E, a, b) => E.some(e => sameEdge(e, a, b));
const isPair = (G, a, b) => pairsOf(G).some(p => sameEdge(p, a, b));
function connected(E) {
  const seen = new Set([0]), st = [0];
  while (st.length) { const x = st.pop(); for (const [a, b] of E) { const y = a === x ? b : b === x ? a : -1; if (y >= 0 && !seen.has(y)) { seen.add(y); st.push(y); } } }
  return seen.size === 7;
}
// Islas activas a un tramo de barco; los volcanes se cruzan.
function reach(G, from, xv = -1) {
  const vo = i => !!G.vo[i] || i === xv;
  const seen = new Set([from]), out = [], st = [from];
  while (st.length) {
    const x = st.pop();
    for (const [a, b] of G.e) {
      const y = a === x ? b : b === x ? a : -1;
      if (y < 0 || seen.has(y)) continue;
      seen.add(y);
      if (vo(y)) st.push(y); else out.push(y);
    }
  }
  return out.sort((a, b) => a - b);
}
const isErRound = r => SCHED.includes(r) || r > 21;
function nextEr(r) { for (let x = r; x < r + 30; x++) if (isErRound(x)) return x; return r; }
function addLog(G, ...e) { G.log.push(e); if (G.log.length > 60) G.log.shift(); }
function legalPicks(G, s) { const p = G.P[s]; return [0, 1, 2, 3, 4].filter(c => !p.ex[c] && !(c === 4 && p.lp === 4)); }
function rescueCost(hasChief, n) { let c = 0, step = hasChief ? 2 : 1; for (let k = 0; k < n; k++) c += step + k; return c; }

function newGame(list) {
  const n = list.length;
  const G = {
    v: 2, gid: rid(6), n, r: 1, st: 0, ph: 'select', q: 0, er: 0, ring: shuffle([1, 2, 3, 4, 5, 6]),
    P: list.map(p => ({ nm: p.nm, k: p.k || '', b: p.b ? 1 : 0, R: [2, 2, 2], pv: 0, rs: MEEPLES, ex: [0, 0, 0, 0, 0], lp: -1, pk: -1, h: { maj: 0, sac: 0, pen: 0, set: 0, vol: 0 } })),
    m: ISL.map(() => Array(n).fill(0)), ch: Array(n).fill(0),
    e: [1, 2, 3, 4, 5, 6].map(k => [0, k]), pr: Array(7).fill(0), vo: Array(7).fill(0),
    deck: shuffle(DECK0.slice()), ord: [], t: 0, tu: null, cnt: [0, 0, 0, 0, 0], ev: null, last: null, log: [], fin: null, disc: [],
  };
  const d = G.deck, ind = d.slice(0, n), sh = d.slice(n, 2 * n);
  const spotsOf = s => [ind[s], sh[s], sh[(s - 1 + n) % n]];
  for (let s = 0; s < n; s++) for (const i of spotsOf(s)) { G.m[i][s]++; G.P[s].rs--; }
  addLog(G, 'setup', G.P.map((_, s) => spotsOf(s)));
  G.deck = shuffle(DECK0.slice());
  addLog(G, 'round', 1, 0);
  return G;
}

function actorsOf(G) {
  if (!G) return [];
  if (G.ph === 'select') return G.P.map((p, s) => p.pk < 0 ? s : -1).filter(s => s >= 0);
  if (G.ph === 'resolve') return [G.ord[G.t]];
  if (G.ph === 'evac') return [G.ev.q[G.ev.k]];
  return [];
}
function initTurn(G) {
  const s = G.ord[G.t], c = G.P[s].pk;
  G.tu = { cm: 0, st: 0, mp: c === 1 ? (G.cnt[1] === 1 ? 3 : 2) : 0, bm: 0, pk: null, cc: 0 };
  G.un = [];
}
// Deshacer: copia de lo que puede cambiar en un turno, antes de cada jugada del jugador activo.
// Se vacía al cambiar de turno y después de mirar cartas con Brujería (ya se ha visto información).
const snapTurn = G => JSON.stringify({ m: G.m, ch: G.ch, e: G.e, P: G.P, tu: G.tu, log: G.log });
const canUndo = G => (G.uc !== undefined ? G.uc : (G.un ? G.un.length : 0)) > 0;
function reveal(G) {
  G.cnt = [0, 0, 0, 0, 0];
  G.P.forEach(p => { G.cnt[p.pk]++; });
  G.P.forEach(p => { p.ex[p.pk] = 1; if (p.pk === 4) p.ex = [0, 0, 0, 0, 0]; p.lp = p.pk; });
  G.ord = G.P.map((_, i) => (G.st + i) % G.n);
  G.t = 0; G.ph = 'resolve'; initTurn(G);
  addLog(G, 'reveal', G.r, G.ord.map(s => [s, G.P[s].pk, G.cnt[G.P[s].pk] > 1 ? 1 : 0]));
}

function apply(G, s, a) {
  if (!G || !a || typeof a !== 'object' || typeof a.t !== 'string' || G.ph === 'end') return false;
  const P = G.P[s];
  if (!P) return false;

  <div><b>The round</b><ul><li>Everyone picks a character in secret; if two or more match, they use the shared version.</li><li>Turns go in order from the first player. Before or after your action you may move your chief one boat hop.</li><li>Actions (except Witchcraft) happen on your chief’s island.</li><li>Colonize: you may pay 1 pig for 1 extra meeple. Move: you may pay 1 coconut for 1 extra point. Once per action each.</li><li>In rounds 6, 11, 15, 18, 20 and 21 an eruption card is revealed.</li></ul></div>
  <div><b>Eruptions and scoring</b><ul><li>Threshold: small 1, medium 2, large 3 cards.</li><li>Evacuating costs 1, 2, 3… shells per piece; the chief takes the first step. Lost meeples: −3 / −2 / −1 VP.</li><li>After each eruption all active islands score: small 2/1, medium 3/1, large 4/2. Tie for 1st: everyone tied gets the 2nd-place points.</li><li>The game ends at the third volcano: pig+shell+coconut sets are worth 2 VP; each meeple on a volcano is −2 VP.</li></ul></div>
  <div><b>Decisions where the rulebook is open</b><ul><li>Each player has ${MEEPLES} meeples.</li><li>At the start of each game the Great Island goes in the centre and the other six are placed around it in random order.</li><li>Boats only join neighbouring islands on the map (spokes and ring).</li><li>A boat hop passes through volcanoes to the next active island.</li><li>Witchcraft alone: the chosen card stays on top and the rest go to the bottom. Shared Witchcraft: you only look at the cards, without changing the order (shells still give extra cards).</li><li>Evacuation: the chief pays 1 shell if you have one; otherwise it is saved for free. Rescues continue from the next step.</li><li>The third eruption also scores majorities before the end.</li><li>After round 21 there is an eruption check every round.</li><li>If the deck runs out, the already revealed cards of still-active islands are reshuffled.</li></ul></div>
  </div></details>`;
  return `<details class="rules"><summary>Reglas rápidas y decisiones del prototipo</summary><div class="cols">
  <div><b>La ronda</b><ul><li>Todos eligen un personaje en secreto; si dos o más coinciden, usan la versión compartida.</li><li>Se resuelve en orden desde el jugador inicial. Antes o después de tu acción puedes mover el jefe un tramo de barco.</li><li>Las acciones (salvo Brujería) ocurren en la isla de tu jefe.</li><li>Colonizar: puedes pagar 1 cerdo por 1 meeple más. Mover: puedes pagar 1 coco por 1 punto más. Una sola vez por acción.</li><li>En las rondas 6, 11, 15, 18, 20 y 21 se revela una carta de erupción.</li></ul></div>
  <div><b>Erupciones y puntos</b><ul><li>Umbral: pequeña 1, mediana 2, grande 3 cartas.</li><li>Evacuar cuesta 1, 2, 3… conchas por pieza; el jefe ocupa el primer escalón. Perder meeples: −3 / −2 / −1 PV.</li><li>Tras cada erupción puntúan todas las islas activas: pequeña 2/1, mediana 3/1, grande 4/2. Empate en el 1.º: todos reciben lo del 2.º.</li><li>Fin al tercer volcán: sets de cerdo+concha+coco 2 PV; cada meeple en un volcán −2 PV.</li></ul></div>
  <div><b>Decisiones tomadas donde el reglamento está abierto</b><ul><li>Cada jugador tiene ${MEEPLES} meeples.</li><li>Al empezar cada partida la Isla Mayor va en el centro y las otras seis se colocan a su alrededor en orden aleatorio.</li><li>Los barcos solo unen islas vecinas del mapa (radios y anillo).</li><li>Un tramo de barco atraviesa volcanes hasta la siguiente isla activa.</li><li>Brujería única: la carta elegida queda arriba y el resto va abajo. Brujería compartida: solo se miran las cartas, sin cambiar el orden (las conchas sí dan cartas extra).</li><li>Evacuación: el jefe paga 1 concha si la tiene; si no, se salva gratis. Los rescates siguen desde el siguiente escalón.</li><li>La tercera erupción también puntúa mayorías antes del final.</li><li>Después de la ronda 21 hay activación cada ronda.</li><li>Si el mazo se agota, se rebarajan las cartas ya reveladas de islas que siguen activas.</li></ul></div>
  </div></details>`;
}

/* ---------- Dibujo y eventos ---------- */
function render() {
  const app = document.getElementById('app');
  const ae = document.activeElement, aid = ae && ae.id;
  let ss = null, se = null;
  try { ss = ae.selectionStart; se = ae.selectionEnd; } catch (e) { /* no es un campo de texto */ }
  let h;
  try { h = G ? gameHTML() : ON.role ? lobbyHTML() : homeHTML(); }
  catch (e) { console.error(e); h = `<p class="err">${tr('No se pudo dibujar la mesa', 'Could not draw the table')}: ${esc(e.message)}</p><button class="btn" data-action="leave">${tr('Volver al inicio', 'Back to start')}</button>`; }
  app.innerHTML = h;
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); try { if (ss !== null) el.setSelectionRange(ss, se); } catch (e) { /* select */ } } }
}
document.getElementById('app').addEventListener('input', e => {
  if (e.target.id === 'nm') { ON.nm = e.target.value; lsSet(NAME_KEY, cleanName(ON.nm)); }
  if (e.target.id === 'code') ui.joinCode = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '');
});
document.getElementById('app').addEventListener('change', e => {
  if (e.target.id === 'rm') { ui.rm = e.target.value; ui.add = ''; render(); }
  if (e.target.id === 'add') { ui.add = e.target.value; render(); }
});
document.getElementById('app').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'code') handle('join', {});
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('g[data-action]')) { e.preventDefault(); const g = e.target.closest('g[data-action]'); handle(g.dataset.action, g.dataset); }
});
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  handle(b.dataset.action, b.dataset);
});
function handle(a, d) {
  const me = mySeat();
  if (a === 'lang') { setLang(d.l); return; }
  ui.err = '';
  switch (a) {
    case 'create': enterGame(rid(4), 'host'); return;
    case 'join': enterGame(ui.joinCode, 'guest'); return;
    case 'join-open': enterGame(d.code, 'guest'); return;
    case 'solo-n': ui.soloN = Number(d.n); break;
    case 'solo': startSolo(); return;
    case 'leave': leaveGame(); return;
    case 'lob-n': ON.lob.n = Number(d.n); publish(); saveState(); break;
    case 'start': hostStart(); return;
    case 'again':
      if (LOCAL) { startSolo(); return; }
      G = null; ON.lastLob = null; publish(); announce(); saveState(); break;
    case 'pick': act({ t: 'pick', c: Number(d.c) }); return;
    case 'chief': act({ t: 'chief', to: Number(d.i) }); return;
    case 'isl':
      if (G && G.ph === 'evac') { ui.evTo = Number(d.i); break; }
      act({ t: 'chief', to: Number(d.i) }); return;
    case 'colonize': act({ t: 'act', pig: !!ui.pig }); return;
    case 'pig': ui.pig = !ui.pig; break;
    case 'coco': act({ t: 'coco' }); return;
    case 'prod-add': if (ui.prod.length < 2) ui.prod.push(Number(d.x)); break;
    case 'prod-clear': ui.prod = []; break;
    case 'extra': ui.extra = Number(d.x); break;
    case 'produce': act({ t: 'act', pick: ui.prod.slice(), extra: ui.extra }); return;
    case 'sh': ui.sh = Number(d.n); break;
    case 'witch-look': act({ t: 'act', sh: ui.sh }); return;
    case 'witch-top': act({ t: 'witch', top: Number(d.j) }); return;
    case 'bonus': ui.bonus = !ui.bonus; if (ui.bonus && me >= 0 && G.P[me].R[ui.pay] < 1) ui.pay = G.P[me].R[2] > 0 ? 2 : 0; break;
    case 'pay': ui.pay = Number(d.x); break;
    case 'sac': act({ t: 'act', bonus: ui.bonus, pay: ui.pay }); return;
    case 'mv': act({ t: 'mv', f: Number(d.f), to: Number(d.t) }); return;
    case 'mv-done': act({ t: 'done' }); return;
    case 'boat': { const r = ui.rm.split('-').map(Number), ad = ui.add.split('-').map(Number); act({ t: 'boat', rm: r, add: ad }); return; }
    case 'end-turn': act({ t: 'end' }); return;
    case 'undo': act({ t: 'undo' }); return;
    case 'unpick': act({ t: 'unpick' }); return;
    case 'ev-n': ui.evN = Number(d.n); break;
    case 'ev-to': ui.evTo = Number(d.i); break;
    case 'ev-ok': act({ t: 'evac', n: ui.evN, to: ui.evTo }); return;
  }
  render();
}

/* ---------- Arranque ---------- */
async function start(hot) {
  ON.tk = (() => { let t = lsGet(TOKEN_KEY); if (typeof t !== 'string' || t.length < 8) { t = rid(12); lsSet(TOKEN_KEY, t); } return t; })();
  ON.nm = lsGet(NAME_KEY) || '';
  const savedLocal = (hot && hot.local) || lsGet(LOCAL_KEY);
  const savedOnline = lsGet(ONLINE_KEY);
  if (savedLocal && Array.isArray(savedLocal.P) && savedLocal.ph !== 'end' && !(savedOnline && savedOnline.role)) { G = savedLocal; LOCAL = true; }
  render();
  scheduleBots();
  const room = await getRoom();
  ON.lobby = room;
  ON.status = room ? 'ok' : 'none';
  if (room) {
    room.onConnection(c => { ON.connected = c; render(); }, e => { ON.roomErr = (e && e.code) || 'error'; render(); });
    room.onPeers(() => { if (!G) render(); }, () => {});
    if (!LOCAL && savedOnline && savedOnline.role && savedOnline.code) await enterGame(savedOnline.code, savedOnline.role, savedOnline);
  }
  render();
  setInterval(() => { if (ON.role === 'guest' || (!G && ON.role)) render(); }, 3000);
}
window.claude?.hot?.snapshot?.(() => ({ local: LOCAL ? G : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
